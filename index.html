<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tool &amp; Equipment Voucher – Claim Now</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-accent: #d01824;
            --primary-accent-dark: #a8101a;
            --primary-accent-tint: #ffebed;
            --card-surface: #ffffff;
            --page-bg: #f1f5f9;
            --heading-color: #0f172a;
            --text-regular: #334155;
            --text-subtle: #64748b;
            --stroke-color: #cbd5e1;
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
            background: var(--page-bg);
            color: var(--heading-color);
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
        }

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 4vw;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 390px;
            height: 100%;
            justify-content: center;
            gap: 2.2vh;
        }

        .voucher {
            width: 100%;
            background: var(--card-surface);
            border-radius: 12px;
            position: relative;
            box-shadow: 0 1vh 3vh rgba(208, 24, 36, 0.09), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 2px dashed var(--stroke-color);
            padding: clamp(16px, 2.8vh, 22px);
            display: flex;
            flex-direction: column;
            gap: 1.4vh;
            flex-shrink: 0;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .voucher:hover {
            transform: translateY(-2px);
            border-color: #f87171;
        }

        .voucher::before, .voucher::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 22px;
            height: 22px;
            background: var(--page-bg);
            border-radius: 50%;
            transform: translateY(-50%);
            border: 2px dashed var(--stroke-color);
            z-index: 2;
        }

        .voucher::before {
            left: -13px;
            border-right-color: transparent;
            border-top-color: transparent;
            transform: translateY(-50%) rotate(45deg);
        }

        .voucher::after {
            right: -13px;
            border-left-color: transparent;
            border-bottom-color: transparent;
            transform: translateY(-50%) rotate(45deg);
        }

        .v-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1.3vh;
        }

        .v-logo {
            height: clamp(26px, 4.5vh, 36px);
            max-width: 175px;
            object-fit: contain;
            display: block;
        }

        .v-badge {
            background: var(--primary-accent-tint);
            color: var(--primary-accent);
            font-size: clamp(0.6rem, 1.2vh, 0.72rem);
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border: 1px solid rgba(208, 24, 36, 0.15);
        }

        .v-mid {
            text-align: center;
            padding: 0.8vh 0;
        }

        .v-label {
            font-size: clamp(0.62rem, 1.25vh, 0.72rem);
            color: var(--text-subtle);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.8px;
            margin-bottom: 3px;
        }

        .v-amount {
            font-family: var(--font-code);
            font-size: clamp(2.4rem, 4.8vh, 3.1rem);
            font-weight: 800;
            color: var(--primary-accent);
            line-height: 1;
            letter-spacing: -1px;
        }

        .v-amount span {
            font-size: clamp(1.2rem, 2.4vh, 1.5rem);
            vertical-align: text-top;
            margin-right: 2px;
        }

        .v-bot {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 0.8vh;
        }

        .v-barcode {
            display: flex;
            gap: 2.5px;
            height: clamp(20px, 3.8vh, 26px);
            align-items: stretch;
            opacity: 0.65;
        }

        .v-barcode i {
            background: var(--heading-color);
            border-radius: 1px;
        }

        .v-status {
            font-size: clamp(0.65rem, 1.3vh, 0.75rem);
            font-weight: 800;
            color: var(--primary-accent);
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .v-status::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary-accent);
            animation: pulse-dot 1.8s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.6; }
        }

        .steps {
            width: 100%;
            background: var(--card-surface);
            border-radius: 12px;
            padding: clamp(6px, 1vh, 10px) 22px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            border: 1px solid #e2e8f0;
            flex-shrink: 1;
            position: relative;
        }

        .steps::before {
            content: '';
            position: absolute;
            left: 35px;
            top: clamp(22px, 3.2vh, 28px);
            bottom: clamp(22px, 3.2vh, 28px);
            width: 2px;
            background: #e2e8f0;
            z-index: 0;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: clamp(10px, 1.8vh, 15px) 0;
            position: relative;
            z-index: 1;
        }

        .step:not(:last-child) {
            border-bottom: 1px solid #f8fafc;
        }

        .s-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--stroke-color);
            color: var(--text-regular);
            font-weight: 800;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            z-index: 2;
        }

        .step:last-child .s-icon {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(208, 24, 36, 0.35);
        }

        .s-txt {
            font-size: clamp(0.74rem, 1.5vh, 0.84rem);
            font-weight: 600;
            color: var(--heading-color);
            flex: 1;
            line-height: 1.35;
        }

        .cta-wrap {
            width: 100%;
            text-align: center;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            padding: clamp(13px, 2.4vh, 17px);
            font-size: clamp(0.98rem, 1.95vh, 1.08rem);
            font-weight: 800;
            color: #ffffff;
            background: var(--primary-accent);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
            box-shadow: 0 4px 16px rgba(208, 24, 36, 0.28);
            min-height: clamp(48px, 6.8vh, 58px);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .btn:hover {
            background: var(--primary-accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(208, 24, 36, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-txt {
            transition: opacity 0.2s ease;
        }

        .spinner {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: spin-anim 0.8s linear infinite;
        }

        .btn.loading .btn-txt {
            opacity: 0;
        }

        .btn.loading .spinner {
            opacity: 1;
            pointer-events: none;
        }

        @keyframes spin-anim {
            to { transform: rotate(360deg); }
        }

        .note {
            font-size: clamp(0.6rem, 1.2vh, 0.7rem);
            color: var(--text-subtle);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            
            <div class="voucher">
                <div class="v-top">
                    <!-- Clean image rendering with fallback SVG container -->
                    <img 
                        src="https://www.freelogovectors.net/wp-content/uploads/2024/03/harbor_freight_logo-freelogovectors.net_.png" 
                        alt="Retailer Rewards Program" 
                        class="v-logo"
                        onerror="this.onerror=null; this.parentElement.innerHTML='<svg width=\'130\' height=\'32\' viewBox=\'0 0 130 32\' fill=\'none\' xmlns=\'http://www.w3.org/2000/svg\'><rect width=\'130\' height=\'32\' rx=\'4\' fill=\'%23d01824\'/><text x=\'50%25\' y=\'21\' text-anchor=\'middle\' font-family=\'Inter, sans-serif\' font-weight=\'900\' font-size=\'14\' fill=\'white\' letter-spacing=\'1.2\'>TOOL REWARD</text></svg><div class=\'v-badge\'>Verified</div>';"
                    >
                    <div class="v-badge">Verified</div>
                </div>

                <div class="v-mid">
                    <div class="v-label">Voucher Value</div>
                    <div class="v-amount"><span>$</span>500</div>
                </div>

                <div class="v-bot">
                    <div class="v-barcode">
                        <i style="width: 2px"></i>
                        <i style="width: 4px"></i>
                        <i style="width: 1px"></i>
                        <i style="width: 3px"></i>
                        <i style="width: 2px"></i>
                        <i style="width: 1px"></i>
                        <i style="width: 4px"></i>
                        <i style="width: 2px"></i>
                        <i style="width: 3px"></i>
                        <i style="width: 1px"></i>
                        <i style="width: 2px"></i>
                        <i style="width: 4px"></i>
                        <i style="width: 1px"></i>
                    </div>
                    <div class="v-status">ACTIVE</div>
                </div>
            </div>

            <div class="steps">
                <div class="step">
                    <div class="s-icon">1</div>
                    <div class="s-txt">Click the button below</div>
                </div>
                <div class="step">
                    <div class="s-icon">2</div>
                    <div class="s-txt">Enter your email &amp; basic info</div>
                </div>
                <div class="step">
                    <div class="s-icon">3</div>
                    <div class="s-txt">Complete 4 to 5 required deals</div>
                </div>
                <div class="step">
                    <div class="s-icon">4</div>
                    <div class="s-txt">Receive your voucher once verified</div>
                </div>
            </div>

            <div class="cta-wrap">
                <button class="btn" id="claim-btn">
                    <span class="btn-txt">Claim Voucher</span>
                    <span class="spinner"></span>
                </button>
                <div class="note">Available in US, CA, AU, UK</div>
            </div>

        </div>
    </div>

    <script>
    (function() {
        const claimBtn = document.getElementById('claim-btn');
        const targetUrl = 'https://linkthem.net/aff_c?offer_id=4397&aff_id=171242';

        claimBtn.addEventListener('click', function() {
            claimBtn.classList.add('loading');
            claimBtn.setAttribute('disabled', 'true');
            
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 800);
        });
    })();
    </script>
</body>
</html>
